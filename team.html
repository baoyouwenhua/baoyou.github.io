#ammo .lbl{font-size:11px;color:#888;margin-top:4px}

.g-btn{position:fixed;border-radius:50%;font-weight:bold;display:none;z-index:70;touch-action:none;font-family:inherit}

#med1Btn{left:24px;bottom:160px;width:56px;height:56px;border:2px solid rgba(74,222,128,.6);background:rgba(74,222,128,.15);color:#4ade80;font-size:22px}
#med2Btn{left:88px;bottom:160px;width:56px;height:56px;border:2px solid rgba(239,68,68,.6);background:rgba(239,68,68,.15);color:#f87171;font-size:22px}
#med3Btn{left:152px;bottom:160px;width:56px;height:56px;border:2px solid rgba(250,204,21,.6);background:rgba(250,204,21,.15);color:#facc15;font-size:22px}
.med-count{position:absolute;right:-2px;top:-2px;background:#05060a;color:#fff;border:1px solid #4ade80;border-radius:50%;width:20px;height:20px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900}

#matchBig{font-size:1.4rem;color:#4ade80;margin:14px 0}

#loadingText{color:#4ade80;font-size:14px;letter-spacing:2px}
</style>
</head><body>

<!-- 人数选择弹窗 -->
<div class="modal-ov show" id="modeModal">

<button onclick="exitGame()">返回大堂</button>
</div>
</div>

</body><script>(function(){

      .select('birth_year,review_status,ban_all_until')

function addChatMsgEl(m){
  var el = document.getElementById('chatList');

  chatCache[m.id] = true;
  var div = document.createElement('div');
  div.className = 'cm';
  div.innerHTML = '<span class="cn">'+esc(m.username)+'：</span>'+esc(m.content);
  el.appendChild(div);

    setTimeout(function(){
      if(div.parentNode) div.parentNode.removeChild(div);
      delete chatCache[m.id];

  }, CHAT_TTL);
}
async function loadChat(){
  try {
    var res = await sb.from('battle_world_chat_solo')
      .select('*').eq('status','approved')
      .order('created_at',{ascending:false}).limit(30);
    var data = (res.data || []).reverse();
    data.forEach(addChatMsgEl);

}
function startChatPolling(){

  if(chatTimer) clearInterval(chatTimer);

  } catch(e){}
};

// ===== 游戏常量 =====
var WORLD_W = 5000, WORLD_H = 5000;

// 团队模式价格
var PRICES = {

function circleHitsRect(cx,cy,r,rect){
  var closestX = Math.max(rect.x, Math.min(cx, rect.x+rect.w));
  var closestY = Math.max(rect.y, Math.min(cy, rect.y+rect.h));
  var dx = cx-closestX, dy = cy-closestY;
  return dx*dx+dy*dy < r*r;

function hitObstacle(cx,cy,r){
  for(var i=0;i<obstacles.length;i++){
    if(circleHitsRect(cx,cy,r,obstacles[i])) return true;
  }
  return false;
}
function buildObstacles(){
  obstacles = [];
  _seed = getTodaySeed();
  var count = 40, tries = 0;
  while(obstacles.length < count && tries < 500){
    tries++;
    var w = 100+seededRandom()*180, h = 100+seededRandom()*180;
    var x = 100+seededRandom()*(WORLD_W-200-w);
    var y = 100+seededRandom()*(WORLD_H-200-h);
    if(x < WORLD_W/2+300 && x+w > WORLD_W/2-300 &&
       y < WORLD_H/2+300 && y+h > WORLD_H/2-300) continue;
    obstacles.push({x:x,y:y,w:w,h:h});
  }
}
function spawnGoldBlocks(){
  goldBlocks = [];
  _seed = getTodaySeed()+1;
  var tries = 0;
  while(goldBlocks.length < 6 && tries < 200){
    tries++;
    var size = 70;
    var x = 150+seededRandom()*(WORLD_W-300-size);
    var y = 150+seededRandom()*(WORLD_H-300-size);
    if(hitObstacle(x+size/2, y+size/2, size)) continue;
    goldBlocks.push({x:x,y:y,w:size,h:size});
  }
}
function placeMerchant(){
  _seed = getTodaySeed()+2;
  merchant = {x:WORLD_W/2+280, y:WORLD_H/2, r:22, interactRange:90};
}

var joyEl = document.getElementById('joy');

var joyActive = false, joyId = null;
var joyCenter = {x:0,y:0}, joyVec = {x:0,y:0};
var JOY_MAX = 50;
function updateJoyCenter(){
  var r = joyEl.getBoundingClientRect();
  joyCenter.x = r.left + r.width/2;
  joyCenter.y = r.top + r.height/2;
}
joyEl.addEventListener('touchstart', function(e){
  e.preventDefault();
  if(joyActive) return;
  var t = e.changedTouches[0];
  joyId = t.identifier; joyActive = true;
  updateJoyCenter(); handleJoyMove(t.clientX, t.clientY);
}, {passive:false});
document.addEventListener('touchmove', function(e){
  if(!joyActive) return;
  for(var i=0;i<e.changedTouches.length;i++){
    if(e.changedTouches[i].identifier===joyId){
      handleJoyMove(e.changedTouches[i].clientX, e.changedTouches[i].clientY);
      e.preventDefault(); return;
    }
  }
}, {passive:false});
function endJoy(e){
  for(var i=0;i<e.changedTouches.length;i++){
    if(e.changedTouches[i].identifier===joyId){
      joyActive = false; joyId = null;
      joyVec.x = 0; joyVec.y = 0;
      joyKnob.style.transform = 'translate(0,0)';
    }
  }
}
document.addEventListener('touchend', endJoy);
document.addEventListener('touchcancel', endJoy);
function handleJoyMove(cx, cy){
  var dx = cx-joyCenter.x, dy = cy-joyCenter.y;
  var d = Math.hypot(dx, dy);
  if(d > JOY_MAX){ dx = dx/d*JOY_MAX; dy = dy/d*JOY_MAX; }
  joyKnob.style.transform = 'translate('+dx+'px,'+dy+'px)';
  joyVec.x = dx/JOY_MAX; joyVec.y = dy/JOY_MAX;
        }// ===== 触摸准星 =====

function updateCamera(){
  if(!myPlayer) return;
  var limit = CAM_LIMIT[myPlayer.weapon] || 0;
  var dx = crosshair.x - myPlayer.x;
  var dy = crosshair.y - myPlayer.y;
  var d = Math.hypot(dx, dy);
  if(d > limit && limit > 0){
    dx = dx/d*limit; dy = dy/d*limit;
  } else if(limit === 0){ dx = 0; dy = 0; }
  var cx = myPlayer.x + dx/2;
  var cy = myPlayer.y + dy/2;
  camera.x = Math.max(0, Math.min(cx - VIEW_W/2, Math.max(0, WORLD_W - VIEW_W)));
  camera.y = Math.max(0, Math.min(cy - VIEW_H/2, Math.max(0, WORLD_H - VIEW_H)));
}

// ===== 武器 =====
function hasWeapon(k){
  if(k==='pistol') return true;
  if(k==='knife') return WEAPONS.knife._bought;
  if(k==='rifle') return WEAPONS.rifle._bought && myPlayer.ammo.rifle > 0;
  if(k==='sniper') return WEAPONS.sniper._bought && myPlayer.ammo.sniper > 0;
  if(k==='mg') return WEAPONS.mg._bought && myPlayer.ammo.mg > 0;
  return false;
}
function switchWeapon(){
  if(!myPlayer || myPlayer.dead) return;
  var owned = [];
  for(var i=0;i<WEAPON_ORDER.length;i++){
    var k = WEAPON_ORDER[i];
    if(hasWeapon(k)) owned.push(k);
  }
  if(owned.length <= 1) return;
  var cur = owned.indexOf(myPlayer.weapon);
  var next = owned[(cur+1) % owned.length];
  myPlayer.weapon = next;
  myPlayer.reloading = false;
  updateAmmoHUD();
  showFloat(myPlayer.x, myPlayer.y - 30, WEAPONS[next].name, '#60a5fa');
}
function startReload(){
  if(!myPlayer || myPlayer.dead || myPlayer.reloading) return;
  var w = WEAPONS[myPlayer.weapon];
  if(w.melee) return;
  if(myPlayer.ammo[myPlayer.weapon] >= w.mag) return;
  myPlayer.reloading = true;
  myPlayer.reloadStart = performance.now();
}
function finishReload(){
  var w = WEAPONS[myPlayer.weapon];
  myPlayer.ammo[myPlayer.weapon] = w.mag;
  myPlayer.reloading = false;
  updateAmmoHUD();
}
function useMed(type){
  if(!myPlayer || myPlayer.dead) return;
  if(type==='hp_pack' && myPlayer.hp_pack > 0){
    if(myPlayer.hp >= myPlayer.maxHp) return;
    myPlayer.hp = Math.min(myPlayer.maxHp, myPlayer.hp + 20);
    myPlayer.hp_pack--;
    showFloat(myPlayer.x, myPlayer.y - 30, '+20 HP', '#4ade80');
  } else if(type==='hp_super' && myPlayer.hp_super > 0){
    if(myPlayer.hp >= myPlayer.maxHp) return;
    myPlayer.hp = Math.min(myPlayer.maxHp, myPlayer.hp + 60);
    myPlayer.hp_super--;
    showFloat(myPlayer.x, myPlayer.y - 30, '+60 HP', '#4ade80');
  } else if(type==='energy' && myPlayer.energy > 0){
    myPlayer.energy--;
    myPlayer.energyTime = 8000;
    showFloat(myPlayer.x, myPlayer.y - 30, '⚡ 加速', '#facc15');
  }
  updateMedCounts();
}// ===== 商店 =====
function tryOpenShop(){
  if(!myPlayer || myPlayer.dead) return;
  if(Math.hypot(myPlayer.x - merchant.x, myPlayer.y - merchant.y) < merchant.interactRange){
    openShop();
  }
}
function openShop(){
  var panel = document.getElementById('shopPanel');
  var itemsEl = document.getElementById('shopItems');
  document.getElementById('shopCoins').textContent = '金币：' + Math.floor(myPlayer.gold);
  itemsEl.innerHTML = '';
  var items = [];

  if(!WEAPONS.rifle._bought){
    items.push({key:'rifle', label:'步枪', desc:'伤害15 · 弹匣150', price: PRICES.rifle.team, type:'weapon'});
  } else {
    items.push({key:'ammo_rifle', label:'步枪子弹 ×50', desc:'50 发', price:50, type:'ammo', target:'rifle', amount:50});
  }
  if(!WEAPONS.sniper._bought){
    items.push({key:'sniper', label:'狙击枪', desc:'伤害90 · 弹匣5', price: PRICES.sniper.team, type:'weapon'});
  } else {
    items.push({key:'ammo_sniper', label:'狙击子弹 ×5', desc:'5 发', price:50, type:'ammo', target:'sniper', amount:5});
  }
  if(!WEAPONS.mg._bought){
    items.push({key:'mg', label:'机枪', desc:'伤害12 · 弹匣250', price: PRICES.mg.team, type:'weapon'});
  } else {
    items.push({key:'ammo_mg', label:'机枪子弹 ×100', desc:'100 发', price:50, type:'ammo', target:'mg', amount:100});
  }
  // 长刀免费，商店不卖

  items.push({key:'hp_pack', label:'血包 💊', desc:'+20 HP · 可叠3', price: PRICES.hp_pack.price, type:'med', target:'hp_pack'});
  items.push({key:'hp_super', label:'超血 🧪', desc:'+60 HP', price: PRICES.hp_super.price, type:'med', target:'hp_super'});
  items.push({key:'energy', label:'能量饮料 ⚡', desc:'+50% 速 8秒', price: PRICES.energy.price, type:'med', target:'energy'});

  items.forEach(function(it){
    var div = document.createElement('div');
    div.className = 'shop-item';
    var info = document.createElement('div');
    info.innerHTML = '<div class="name">'+it.label+'</div><div class="desc">'+it.desc+'</div>';
    var btn = document.createElement('button');
    btn.textContent = it.price + ' 金';
    if(myPlayer.gold < it.price) btn.disabled = true;
    else btn.onclick = function(){ buyItem(it); };
    div.appendChild(info); div.appendChild(btn);
    itemsEl.appendChild(div);
  });
  panel.classList.add('show');
}

function buyItem(it){
  if(myPlayer.gold < it.price) return;
  if(it.type === 'weapon'){
    WEAPONS[it.key]._bought = true;
    if(it.key==='rifle') myPlayer.ammo.rifle = 150;
    if(it.key==='sniper') myPlayer.ammo.sniper = 5;
    if(it.key==='mg') myPlayer.ammo.mg = 250;
    if(it.key==='knife') myPlayer.ammo.knife = Infinity;
    myPlayer.weapon = it.key;
  } else if(it.type === 'ammo'){
    myPlayer.ammo[it.target] = (myPlayer.ammo[it.target]||0) + it.amount;
  } else if(it.type === 'med'){
    if(it.target==='hp_pack') myPlayer.hp_pack = Math.min(3, myPlayer.hp_pack + 1);
    else if(it.target==='hp_super') myPlayer.hp_super++;
    else if(it.target==='energy') myPlayer.energy++;
  }
  myPlayer.gold -= it.price;
  updateAmmoHUD(); updateMedCounts(); openShop();
}

async function fetchOnline(){
  try {
    var res = await sb.rpc('battle_get_online', { p_mode: 'team' });
    if(res.error || !res.data) return;
    var data = res.data;
    if(typeof data === 'string'){ try{ data = JSON.parse(data); }catch(e){ return; } }
    if(!Array.isArray(data)) return;
    var id = ensureNetId();
    var now = Date.now();
    data.forEach(function(p){
      if(p.username === id) return;
      onlinePlayers[p.username] = {
        x:p.x, y:p.y, hp:p.hp, weapon:p.weapon,
        team:p.team, kills:p.kills, lastRecv: now
      };
    });
    for(var k in onlinePlayers){
      if(now - onlinePlayers[k].lastRecv > 3000) delete onlinePlayers[k];
    }
  } catch(e){}
}
async function fetchRemoteBullets(){
  try {
    var res = await sb.rpc('battle_get_bullets', { p_mode: 'team' });
    if(res.error || !res.data) return;
    var data = res.data;
    if(typeof data === 'string'){ try{ data = JSON.parse(data); }catch(e){ return; } }
    if(!Array.isArray(data)) return;
    var id = ensureNetId();
    data.forEach(function(b){
      if(b.owner === id) return;
      if(remoteBullets.find(function(x){ return x.id === b.id; })) return;

// ===== 射击 =====
function shoot(){
  if(!myPlayer || myPlayer.dead) return;
  var w = WEAPONS[myPlayer.weapon];
  if(myPlayer.reloading) return;
  if(!w.melee && myPlayer.ammo[myPlayer.weapon] <= 0){ startReload(); return; }

  if(w.melee){
    var dx0 = crosshair.x - myPlayer.x;
    var dy0 = crosshair.y - myPlayer.y;
    var d0 = Math.hypot(dx0, dy0) || 1;
    var tx = myPlayer.x + dx0/d0*40;
    var ty = myPlayer.y + dy0/d0*40;
    for(var i=0;i<ais.length;i++){
      var a = ais[i];
      if(a.dead || a.team === myTeam) continue;
      if(Math.hypot(a.x - tx, a.y - ty) < 40) hitAI(a, w.dmg, myPlayer);
    }
    return;
  }

  var dx = crosshair.x - myPlayer.x;
  var dy = crosshair.y - myPlayer.y;
  var d = Math.hypot(dx, dy);
  if(d < 0.01) return;
  dx /= d; dy /= d;
  var ang = Math.atan2(dy, dx) + (Math.random()-0.5) * w.spread * 2;
  var bullet = {
    x: myPlayer.x + Math.cos(ang)*(myPlayer.r+4),
    y: myPlayer.y + Math.sin(ang)*(myPlayer.r+4),
    vx: Math.cos(ang)*w.speed,
    vy: Math.sin(ang)*w.speed,
    owner: myPlayer, ownerTeam: myPlayer.team, ownerIsMe: true,
    life: w.range, dmg: w.dmg, pierceLeft: w.pierce || 0
  };
  bullets.push(bullet);
  uploadBullet(bullet);
  myPlayer.ammo[myPlayer.weapon]--;
  updateAmmoHUD();
}

function aiShoot(ai){
  var aw = WEAPONS[ai.weapon] || WEAPONS.rifle;
  if(!aw.melee){
    if(!ai.ammo) ai.ammo = {};
    if((ai.ammo[ai.weapon] || 0) <= 0){
      ai.weapon = 'pistol'; aw = WEAPONS.pistol;
      if((ai.ammo.pistol || 0) <= 0) return;
    }
  }
  var target = null, minD = 999999;
  if(myPlayer && !myPlayer.dead && myPlayer.team !== ai.team){
    var d0 = Math.hypot(myPlayer.x - ai.x, myPlayer.y - ai.y);
    if(d0 < minD){ minD = d0; target = myPlayer; }
  }
  for(var i=0;i<ais.length;i++){
    var other = ais[i];
    if(other === ai || other.dead || other.team === ai.team) continue;
    var d2 = Math.hypot(other.x - ai.x, other.y - ai.y);
    if(d2 < minD){ minD = d2; target = other; }
  }
  if(!target) return;
  if(aw.melee){ if(minD < 50) hitAI(target, aw.dmg, ai); return; }
  if(minD > 700) return;
  var dx = target.x - ai.x;
  var dy = target.y - ai.y;
  var dd = Math.hypot(dx, dy) || 1;
  var spread = (aw.spread || 0.05) * 1.2;
  var ang = Math.atan2(dy, dx) + (Math.random()-0.5)*spread*2;
  var dmg = Math.round((aw.dmg || 15) * 0.6);
  bullets.push({
    x: ai.x + Math.cos(ang)*(ai.r+4),
    y: ai.y + Math.sin(ang)*(ai.r+4),
    vx: Math.cos(ang)*14, vy: Math.sin(ang)*14,
    owner: ai, ownerTeam: ai.team, ownerIsMe: false,
    life: 60, dmg: dmg, pierceLeft: 0
  });
  if(ai.ammo) ai.ammo[ai.weapon] = (ai.ammo[ai.weapon] || 0) - 1;
}

function hitAI(ai, dmg, shooter){
  ai.hp -= dmg;
  showFloat(ai.x, ai.y - 30, '-' + dmg, '#ef4444');
  if(ai.hp > 0) return;
  ai.hp = 0; ai.dead = true; ai.respawn = 3000;
  var killerName = shooter ? shooter.name : '?';
  if(shooter === myPlayer){
    myPlayer.kills++;
    myPlayer.gold += 100;
    if(myTeam === 'red') scoreRed++; else scoreBlue++;
    updateAmmoHUD(); updateScoreBoard();
  } else if(shooter){
    shooter.gold = (shooter.gold || 0) + 100;
    if(shooter.team === 'red') scoreRed++; else scoreBlue++;
    updateScoreBoard();
  }
  showKill(killerName, ai.name, shooter ? shooter.team : 'red');
}// ===== 命中玩家 =====
function hitPlayer(dmg, shooter){
  if(!myPlayer || myPlayer.dead) return;
  myPlayer.hp -= dmg;
  showFloat(myPlayer.x, myPlayer.y - 30, '-' + dmg, '#ef4444');
  if(myPlayer.hp > 0) return;
  myPlayer.hp = 0; myPlayer.dead = true; myPlayer.respawn = 3000;
  myPlayer.deaths++;
  if(shooter){
    if(shooter.team === 'red') scoreRed++; else scoreBlue++;
    updateScoreBoard();
    showKill(shooter.name || '?', myPlayer.name, shooter.team || 'blue');
    try { sb.rpc('battle_kill', { p_killer: shooter.name || '未知', p_victim: ensureNetId() }); } catch(e){}
  }
}

// ===== 更新玩家 =====
function updatePlayer(dt){
  if(!myPlayer) return;

  if(myPlayer.dead){
    myPlayer.respawn -= dt * TICK;
    if(myPlayer.respawn <= 0){
      myPlayer.dead = false;
      myPlayer.hp = myPlayer.maxHp;
      var tries = 0;
      do {
        myPlayer.x = WORLD_W/2 + (Math.random()-0.5)*600;
        myPlayer.y = WORLD_H/2 + (Math.random()-0.5)*600;
        tries++;
      } while(tries < 50 && hitObstacle(myPlayer.x, myPlayer.y, myPlayer.r));
    }
    return;
  }

  if(myPlayer.energyTime > 0){
    myPlayer.energyTime -= dt * TICK;
    myPlayer.speed = myPlayer.baseSpeed * 1.5;
  } else {
    myPlayer.speed = myPlayer.baseSpeed;
  }
  var curW = WEAPONS[myPlayer.weapon];
  if(curW.slow) myPlayer.speed *= (1 - curW.slow);

  var dx = 0, dy = 0;
  if(keys['w']) dy -= 1;
  if(keys['s']) dy += 1;
  if(keys['a']) dx -= 1;
  if(keys['d']) dx += 1;
  if(joyActive){ dx += joyVec.x; dy += joyVec.y; }

  var len = Math.hypot(dx, dy);
  var moving = false;
  if(len > 0.01){
    moving = true;
    if(len > 1){ dx /= len; dy /= len; }
    var nx = myPlayer.x + dx * myPlayer.speed * dt;
    var ny = myPlayer.y + dy * myPlayer.speed * dt;
    if(nx - myPlayer.r > 0 && nx + myPlayer.r < WORLD_W && !hitObstacle(nx, myPlayer.y, myPlayer.r)) myPlayer.x = nx;
    if(ny - myPlayer.r > 0 && ny + myPlayer.r < WORLD_H && !hitObstacle(myPlayer.x, ny, myPlayer.r)) myPlayer.y = ny;
  }

  if(!moving){
    for(var i=0;i<goldBlocks.length;i++){
      var g = goldBlocks[i];
      if(myPlayer.x > g.x && myPlayer.x < g.x+g.w &&
         myPlayer.y > g.y && myPlayer.y < g.y+g.h){
        myPlayer.gold += 10 * dt / 60;
        break;
      }
    }
  }

  if(myPlayer.reloading){
    var w = WEAPONS[myPlayer.weapon];
    if(performance.now() - myPlayer.reloadStart >= w.reload) finishReload();
  }

  myPlayer.fireCd -= dt * TICK;
  var firing = mouseDown || mobileFire || keys[' '];
  if(firing && myPlayer.fireCd <= 0 && !myPlayer.reloading){
    shoot();
    myPlayer.fireCd = curW.cd;
  }

  _uploadAcc += dt * TICK;
  if(_uploadAcc >= 100){ _uploadAcc = 0; uploadMyPos(); }

  _fetchAcc += dt * TICK;
  if(_fetchAcc >= 500){ _fetchAcc = 0; fetchOnline(); }

  _bulletAcc += dt * TICK;
  if(_bulletAcc >= 200){ _bulletAcc = 0; fetchRemoteBullets(); }

  for(var j=remoteBullets.length-1; j>=0; j--){
    var b = remoteBullets[j];
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    b.life -= dt * TICK;
    if(b.life <= 0){ remoteBullets.splice(j,1); continue; }
    if(myPlayer && !myPlayer.dead && b.team !== myTeam &&
       Math.hypot(myPlayer.x - b.x, myPlayer.y - b.y) < myPlayer.r){
      myPlayer.hp -= b.dmg;
      showFloat(myPlayer.x, myPlayer.y - 30, '-'+b.dmg, '#ef4444');
      if(myPlayer.hp <= 0){
        myPlayer.hp = 0; myPlayer.dead = true;
        myPlayer.respawn = 3000; myPlayer.deaths++;
        showKill(b.owner, myPlayer.name, b.team);
        try { sb.rpc('battle_kill', { p_killer: b.owner, p_victim: ensureNetId() }); } catch(e){}
      }
      remoteBullets.splice(j,1);
    }
  }
}

// ===== AI 行为 =====
function updateAI(ai, dt){
  if(performance.now() < spawnProtectUntil) return;

  if(ai.dead){
    ai.respawn -= dt * TICK;
    if(ai.respawn <= 0){
      ai.dead = false; ai.hp = ai.maxHp; ai.retreating = false;
      var pool = ['rifle','mg','sniper','knife','pistol'];
      ai.weapon = pool[Math.floor(Math.random()*pool.length)];
      ai.ammo = { pistol: 30, rifle: 150, sniper: 5, mg: 250, knife: Infinity };
      var tries2 = 0;
      do {
        var ang = Math.random() * Math.PI * 2;
        var d = 800 + Math.random() * 700;
        ai.x = (myPlayer ? myPlayer.x : WORLD_W/2) + Math.cos(ang) * d;
        ai.y = (myPlayer ? myPlayer.y : WORLD_H/2) + Math.sin(ang) * d;
        ai.x = Math.max(100, Math.min(WORLD_W-100, ai.x));
        ai.y = Math.max(100, Math.min(WORLD_H-100, ai.y));
        tries2++;
      } while(tries2 < 50 && hitObstacle(ai.x, ai.y, ai.r));
    }
    return;
  }

  if(ai.retreating && ai.hp < ai.maxHp){
    ai.hp += 0.01 * dt;
    if(ai.hp > ai.maxHp) ai.hp = ai.maxHp;
    if(ai.hp >= ai.maxHp * 0.9) ai.retreating = false;
  }

  var target = null, minD = 999999;
  if(myPlayer && !myPlayer.dead && myPlayer.team !== ai.team){
    var d0 = Math.hypot(myPlayer.x - ai.x, myPlayer.y - ai.y);
    if(d0 < minD){ minD = d0; target = myPlayer; }
  }
  for(var i=0;i<ais.length;i++){
    var other = ais[i];
    if(other === ai || other.dead || other.team === ai.team) continue;
    var d2 = Math.hypot(other.x - ai.x, other.y - ai.y);
    if(d2 < minD){ minD = d2; target = other; }
  }

  var canSee = !!target && minD < 2000;
  var aw = WEAPONS[ai.weapon] || WEAPONS.rifle;
  var idealMin = 200, idealMax = 400;
  if(aw.melee){ idealMin = 0; idealMax = 30; }
  else if(ai.weapon === 'pistol'){ idealMin = 150; idealMax = 280; }
  else if(ai.weapon === 'rifle'){ idealMin = 200; idealMax = 400; }
  else if(ai.weapon === 'mg'){ idealMin = 250; idealMax = 450; }
  else if(ai.weapon === 'sniper'){ idealMin = 500; idealMax = 700; }

  if(ai.hp < ai.maxHp * 0.3 && !ai.retreating) ai.retreating = true;

  var moveX = 0, moveY = 0;
  var dx = target ? target.x - ai.x : 0;
  var dy = target ? target.y - ai.y : 0;
  var dist = target ? minD : 0;

  if(canSee && dist > 0.01){
    if(ai.retreating){ moveX = -dx/dist; moveY = -dy/dist; }
    else if(dist < idealMin){ moveX = -dx/dist; moveY = -dy/dist; }
    else if(dist > idealMax){ moveX = dx/dist; moveY = dy/dist; }
    else {
      ai.wander -= dt * TICK;
      if(ai.wander <= 0){ ai.wander = 600 + Math.random()*800; ai.wanderDir = Math.random() < 0.5 ? 1 : -1; }
      moveX = -dy/dist * ai.wanderDir * 0.7;
      moveY = dx/dist * ai.wanderDir * 0.7;
    }
  } else {
    if(ai.gold >= 300 && merchant){
      var dm = Math.hypot(merchant.x - ai.x, merchant.y - ai.y);
      if(dm > 60){ moveX = (merchant.x - ai.x)/dm; moveY = (merchant.y - ai.y)/dm; }
      else {
        ai.gold = 0;
        var buyPool = ['rifle','mg','sniper','knife'];
        ai.weapon = buyPool[Math.floor(Math.random()*buyPool.length)];
        ai.ammo = { pistol: 30, rifle: 150, sniper: 5, mg: 250, knife: Infinity };
      }
    } else if(ai.gold < 300 && goldBlocks.length){
      var nearest = null, nd = 999999;
      for(var g=0; g<goldBlocks.length; g++){
        var gb = goldBlocks[g];
        var gd = Math.hypot(gb.x+gb.w/2 - ai.x, gb.y+gb.h/2 - ai.y);
        if(gd < nd){ nd  = gd; nearest = gb; }
      }
      if(nearest){
        var tx = nearest.x + nearest.w/2;
        var ty = nearest.y + nearest.h/2;
        var tdx = tx - ai.x, tdy = ty - ai.y;
        var tdd = Math.hypot(tdx, tdy) || 1;
        if(tdd > 30){ moveX = tdx/tdd; moveY = tdy/tdd; }
        else { ai.gold += 10 * dt / 60; }
      }
    } else {
      ai.wander -= dt * TICK;
      if(ai.wander <= 0){ ai.wander = 1000 + Math.random()*2000; ai.wanderDir = Math.random()*Math.PI*2; }
      moveX = Math.cos(ai.wanderDir); moveY = Math.sin(ai.wanderDir);
    }
  }

  var nx = ai.x + moveX * ai.speed * dt;
  var ny = ai.y + moveY * ai.speed * dt;
  if(nx - ai.r > 0 && nx + ai.r < WORLD_W && !hitObstacle(nx, ai.y, ai.r)) ai.x = nx;
  if(ny - ai.r > 0 && ny + ai.r < WORLD_H && !hitObstacle(ai.x, ny, ai.r)) ai.y = ny;

  ai.fireCd -= dt * TICK;
  if(canSee && !ai.retreating && ai.fireCd <= 0){
    if(aw.melee){ if(dist < 50){ aiShoot(ai); ai.fireCd = aw.cd; } }
    else if(dist < 700){ aiShoot(ai); ai.fireCd = aw.cd * 2.5 + Math.random() * 200; }
  }
}

// ===== 子弹更新 =====
function updateBullets(dt){
  var newBullets = [];
  for(var i=0;i<bullets.length;i++){
    var b = bullets[i];
    var nx = b.x + b.vx * dt;
    var ny = b.y + b.vy * dt;
    b.life -= dt;

    if(nx < 0 || nx > WORLD_W || ny < 0 || ny > WORLD_H) continue;

    var hitWall = false;
    for(var j=0;j<obstacles.length;j++){
      var o = obstacles[j];
      if(nx > o.x && nx < o.x + o.w && ny > o.y && ny < o.y + o.h){
        if(b.pierceLeft > 0){ b.pierceLeft--; b.dmg = Math.round(b.dmg * 0.5); }
        else { hitWall = true; }
        break;
      }
    }
    if(hitWall) continue;

    b.x = nx; b.y = ny;

    var consumed = false;
    if(myPlayer && !myPlayer.dead && b.owner !== myPlayer && b.ownerTeam !== myTeam){
      if(Math.hypot(myPlayer.x - b.x, myPlayer.y - b.y) < myPlayer.r){
        hitPlayer(b.dmg, b.owner);
        consumed = true;
      }
    }
    if(!consumed){
      for(var k=0;k<ais.length;k++){
        var a = ais[k];
        if(a.dead) continue;
        if(b.owner === a) continue;
        if(a.team === b.ownerTeam) continue;
        if(Math.hypot(a.x - b.x, a.y - b.y) < a.r){
          hitAI(a, b.dmg, b.owner);
          consumed = true;
          break;
        }
      }
    }

    if(consumed) continue;
    if(b.life > 0) newBullets.push(b);
  }
  bullets = newBullets;
}// ===== 渲染 =====
function render(){
  gctx.fillStyle = '#14141c';
  gctx.fillRect(0, 0, VIEW_W, VIEW_H);

  var GRID = 80;
  var startX = Math.floor(camera.x / GRID) * GRID;
  var startY = Math.floor(camera.y / GRID) * GRID;
  gctx.strokeStyle = 'rgba(255,255,255,0.03)';
  gctx.lineWidth = 1;
  for(var x=startX; x<camera.x + VIEW_W; x += GRID){
    gctx.beginPath(); gctx.moveTo(x - camera.x, 0); gctx.lineTo(x - camera.x, VIEW_H); gctx.stroke();
  }
  for(var y=startY; y<camera.y + VIEW_H; y += GRID){
    gctx.beginPath(); gctx.moveTo(0, y - camera.y); gctx.lineTo(VIEW_W, y - camera.y); gctx.stroke();
  }

  gctx.strokeStyle = 'rgba(255,255,255,0.15)';
  gctx.lineWidth = 3;
  gctx.strokeRect(-camera.x, -camera.y, WORLD_W, WORLD_H);

  for(var i=0;i<goldBlocks.length;i++){
    var g = goldBlocks[i];
    var sx = g.x - camera.x, sy = g.y - camera.y;
    if(sx + g.w < 0 || sx > VIEW_W || sy + g.h < 0 || sy > VIEW_H) continue;
    gctx.fillStyle = 'rgba(251,191,36,0.15)';
    gctx.fillRect(sx, sy, g.w, g.h);
    gctx.strokeStyle = 'rgba(251,191,36,0.6)';
    gctx.lineWidth = 2;
    gctx.setLineDash([6, 4]);
    gctx.strokeRect(sx, sy, g.w, g.h);
    gctx.setLineDash([]);
    gctx.fillStyle = '#fbbf24';
    gctx.font = 'bold 20px system-ui';
    gctx.textAlign = 'center';
    gctx.fillText('💰', sx + g.w/2, sy + g.h/2 + 7);
    gctx.textAlign = 'left';
  }

  for(var j=0;j<obstacles.length;j++){
    var o = obstacles[j];
    var ox = o.x - camera.x, oy = o.y - camera.y;
    if(ox + o.w < 0 || ox > VIEW_W || oy + o.h < 0 || oy > VIEW_H) continue;
    gctx.fillStyle = '#0d0d14';
    gctx.fillRect(ox, oy, o.w, o.h);
    gctx.strokeStyle = 'rgba(255,255,255,0.08)';
    gctx.lineWidth = 1;
    gctx.strokeRect(ox, oy, o.w, o.h);
  }

  if(merchant){
    var mx = merchant.x - camera.x, my = merchant.y - camera.y;
    if(mx + 60 > 0 && mx - 60 < VIEW_W && my + 60 > 0 && my - 60 < VIEW_H){
      var near = myPlayer && Math.hypot(myPlayer.x - merchant.x, myPlayer.y - merchant.y) < merchant.interactRange;
      if(near){
        gctx.beginPath();
        gctx.arc(mx, my, merchant.r + 15, 0, Math.PI*2);
        gctx.fillStyle = 'rgba(74,222,128,0.15)';
        gctx.fill();
      }
      gctx.fillStyle = '#d97706';
      gctx.fillRect(mx - merchant.r, my - merchant.r*0.3, merchant.r*2, merchant.r*1.6);
      gctx.strokeStyle = '#fbbf24';
      gctx.lineWidth = 2;
      gctx.strokeRect(mx - merchant.r, my - merchant.r*0.3, merchant.r*2, merchant.r*1.6);
      gctx.fillStyle = '#fbbf24';
      gctx.beginPath();
      gctx.arc(mx, my - merchant.r*0.4, merchant.r*0.85, 0, Math.PI*2);
      gctx.fill();
      gctx.strokeStyle = '#fef3c7';
      gctx.stroke();
      gctx.fillStyle = '#fff';
      gctx.font = 'bold 16px system-ui';
      gctx.textAlign = 'center';
      gctx.fillText('💰', mx, my - merchant.r*0.35);
      gctx.fillStyle = '#fbbf24';
      gctx.font = 'bold 12px system-ui';
      gctx.fillText('商人', mx, my - merchant.r*1.5 - 8);
      gctx.textAlign = 'left';
    }
  }

  for(var pid in onlinePlayers){
    var p = onlinePlayers[pid];
    drawRemote(p, p.x - camera.x, p.y - camera.y, pid);
  }

  for(var k=0;k<ais.length;k++) drawPerson(ais[k]);
  if(myPlayer) drawPerson(myPlayer);

  gctx.fillStyle = '#f87171';
  gctx.shadowColor = '#f87171';
  gctx.shadowBlur = 6;
  remoteBullets.forEach(function(b){
    var sx = b.x - camera.x, sy = b.y - camera.y;
    if(sx < -20 || sx > VIEW_W+20 || sy < -20 || sy > VIEW_H+20) return;
    gctx.beginPath(); gctx.arc(sx, sy, 3, 0, Math.PI*2); gctx.fill();
  });
  gctx.shadowBlur = 0;

  gctx.strokeStyle = '#fbbf24';
  gctx.lineWidth = 2;
  gctx.shadowColor = '#fbbf24';
  gctx.shadowBlur = 6;
  for(var m=0;m<bullets.length;m++){
    var b = bullets[m];
    var bsx = b.x - camera.x, bsy = b.y - camera.y;
    var bex = bsx - b.vx * 0.8, bey = bsy - b.vy * 0.8;
    gctx.beginPath(); gctx.moveTo(bsx, bsy); gctx.lineTo(bex, bey); gctx.stroke();
  }
  gctx.shadowBlur = 0;

  var chx = crosshair.x - camera.x, chy = crosshair.y - camera.y;
  gctx.strokeStyle = '#fbbf24';
  gctx.lineWidth = 2;
  gctx.beginPath(); gctx.arc(chx, chy, 10, 0, Math.PI*2); gctx.stroke();
  gctx.beginPath();
  gctx.moveTo(chx-16, chy); gctx.lineTo(chx-4, chy);
  gctx.moveTo(chx+4, chy); gctx.lineTo(chx+16, chy);
  gctx.moveTo(chx, chy-16); gctx.lineTo(chx, chy-4);
  gctx.moveTo(chx, chy+4); gctx.lineTo(chx, chy+16);
  gctx.stroke();

  var newFloats = [];
  for(var f=0;f<floatTexts.length;f++){
    var ft = floatTexts[f];
    ft.life -= 16; ft.y += ft.vy;
    if(ft.life > 0){
      gctx.globalAlpha = Math.min(1, ft.life / 400);
      gctx.fillStyle = ft.color;
      gctx.font = 'bold 14px system-ui';
      gctx.textAlign = 'center';
      gctx.fillText(ft.text, ft.x - camera.x, ft.y - camera.y);
      gctx.textAlign = 'left';
      gctx.globalAlpha = 1;
      newFloats.push(ft);
    }
  }
  floatTexts = newFloats;
}

function drawRemote(p, sx, sy, name){
  if(sx + 40 < 0 || sx - 40 > VIEW_W || sy + 40 < 0 || sy - 40 > VIEW_H) return;
  var color = p.team === 'red' ? '#f87171' : '#60a5fa';
  gctx.fillStyle = p.team === 'red' ? '#7f1d1d' : '#1e3a8a';
  gctx.fillRect(sx - 14, sy - 4, 28, 22);
  gctx.strokeStyle = color;
  gctx.lineWidth = 1;
  gctx.strokeRect(sx - 14, sy - 4, 28, 22);
  gctx.fillStyle = p.team === 'red' ? '#991b1b' : '#1e40af';
  gctx.beginPath();
  gctx.arc(sx, sy - 8, 12, 0, Math.PI*2);
  gctx.fill();
  gctx.strokeStyle = color;
  gctx.stroke();
  gctx.fillStyle = color;
  gctx.font = 'bold 12px system-ui';
  gctx.textAlign = 'center';
  gctx.fillText('👤 ' + name, sx, sy - 36);
  gctx.textAlign = 'left';
  var barW = 44, barH = 4;
  var bx = sx - barW/2, by = sy - 22;
  gctx.fillStyle = 'rgba(0,0,0,0.6)';
  gctx.fillRect(bx, by, barW, barH);
  var ratio = Math.max(0, Math.min(1, p.hp / 100));
  gctx.fillStyle = ratio > 0.5 ? '#4ade80' : ratio > 0.25 ? '#facc15' : '#ef4444';
  gctx.fillRect(bx, by, barW * ratio, barH);
}

function drawPerson(t){
  if(t.dead) return;
  var sx = t.x - camera.x;
  var sy = t.y - camera.y;
  if(sx + 40 < 0 || sx - 40 > VIEW_W || sy + 40 < 0 || sy - 40 > VIEW_H) return;

  var isMe = t === myPlayer;
  var headColor, bodyColor, strokeColor;

  if(isMe){
    headColor = myTeam === 'red' ? '#dc2626' : '#2563eb';
    bodyColor = myTeam === 'red' ? '#991b1b' : '#1e40af';
    strokeColor = myTeam === 'red' ? '#fca5a5' : '#93c5fd';
  } else if(t.colors){
    headColor = t.colors.head;
    bodyColor = t.colors.body;
    strokeColor = t.colors.stroke;
  } else {
    headColor = '#dc2626'; bodyColor = '#991b1b'; strokeColor = '#fca5a5';
  }

  gctx.fillStyle = bodyColor;
  gctx.fillRect(sx - t.r, sy - t.r*0.3, t.r*2, t.r*1.6);
  gctx.strokeStyle = strokeColor;
  gctx.lineWidth = 1;
  gctx.strokeRect(sx - t.r, sy - t.r*0.3, t.r*2, t.r*1.6);

  gctx.fillStyle = headColor;
  gctx.beginPath();
  gctx.arc(sx, sy - t.r*0.4, t.r*0.85, 0, Math.PI*2);
  gctx.fill();
  gctx.strokeStyle = strokeColor;
  gctx.stroke();

  var wname = (WEAPONS[t.weapon] || WEAPONS.rifle).name;
  gctx.fillStyle = '#fbbf24';
  gctx.font = '10px system-ui';
  gctx.textAlign = 'center';
  gctx.fillText(wname, sx, sy + t.r*1.8 + 10);

  var aimX = isMe ? crosshair.x : (t.aimX || t.x);
  var aimY = isMe ? crosshair.y : (t.aimY || t.y);
  var ax = aimX - t.x, ay = aimY - t.y;
  var al = Math.hypot(ax, ay);
  if(al > 0.01){
    ax /= al; ay /= al;
    gctx.strokeStyle = isMe ? '#fca5a5' : '#666';
    gctx.lineWidth = 3;
    gctx.beginPath();
    gctx.moveTo(sx, sy);
    gctx.lineTo(sx + ax*(t.r+10), sy + ay*(t.r+10));
    gctx.stroke();
  }

  var barW = 44, barH = 4;
  var bx = sx - barW/2, by = sy - t.r*1.5 - 14;
  gctx.fillStyle = 'rgba(0,0,0,0.6)';
  gctx.fillRect(bx, by, barW, barH);
  var hpRatio = t.hp / t.maxHp;
  gctx.fillStyle = hpRatio > 0.5 ? '#4ade80' : hpRatio > 0.25 ? '#facc15' : '#ef4444';
  gctx.fillRect(bx, by, barW * hpRatio, barH);

  var nameColor = isMe ? (myTeam==='red' ? '#fca5a5' : '#93c5fd') : (t.team==='red' ? '#fca5a5' : '#93c5fd');
  gctx.fillStyle = nameColor;
  gctx.font = '11px system-ui';
  gctx.textAlign = 'center';
  gctx.fillText(t.name, sx, by - 4);
  gctx.textAlign = 'left';
}

// ===== 小地图 =====
var minimapCanvas = document.getElementById('minimap');
var mmctx = minimapCanvas ? minimapCanvas.getContext('2d') : null;
var MM_SIZE = 170;

function renderMinimap(){
  if(!mmctx) return;
  var scale = MM_SIZE / WORLD_W;
  mmctx.clearRect(0, 0, MM_SIZE, MM_SIZE);
  mmctx.fillStyle = 'rgba(20,20,28,0.85)';
  mmctx.fillRect(0, 0, MM_SIZE, MM_SIZE);
  mmctx.fillStyle = 'rgba(255,255,255,0.12)';
  for(var i=0;i<obstacles.length;i++){
    var o = obstacles[i];
    mmctx.fillRect(o.x*scale, o.y*scale, o.w*scale, o.h*scale);
  }
  mmctx.fillStyle = '#fbbf24';
  for(var g=0;g<goldBlocks.length;g++){
    var gb = goldBlocks[g];
    mmctx.fillRect(gb.x*scale, gb.y*scale, gb.w*scale, gb.h*scale);
  }
  if(merchant){
    mmctx.fillStyle = '#4ade80';
    mmctx.beginPath();
    mmctx.arc(merchant.x*scale, merchant.y*scale, 5, 0, Math.PI*2);
    mmctx.fill();
  }
  for(var pid in onlinePlayers){
    var p = onlinePlayers[pid];
    mmctx.fillStyle = p.team === 'red' ? '#f87171' : '#60a5fa';
    mmctx.beginPath();
    mmctx.arc(p.x*scale, p.y*scale, 3, 0, Math.PI*2);
    mmctx.fill();
  }
  for(var a=0;a<ais.length;a++){
    var ai = ais[a];
    if(ai.dead) continue;
    mmctx.fillStyle = ai.team === 'red' ? '#7f1d1d' : '#1e3a8a';
    mmctx.beginPath();
    mmctx.arc(ai.x*scale, ai.y*scale, 2.5, 0, Math.PI*2);
    mmctx.fill();
  }
  if(myPlayer){
    mmctx.fillStyle = '#fff';
    mmctx.beginPath();
    mmctx.arc(myPlayer.x*scale, myPlayer.y*scale, 4, 0, Math.PI*2);
    mmctx.fill();
    mmctx.strokeStyle = myTeam === 'red' ? '#f87171' : '#60a5fa';
    mmctx.lineWidth = 2;
    mmctx.stroke();
  }
}// ===== 人数选择 =====
var matchTimer = null;
var waitingStart = 0;

window.pickMode = function(n){
  teamSize = n;
  document.getElementById('modeModal').classList.remove('show');
  document.getElementById('matchModal').classList.add('show');
  startMatchmaking();
};

// ===== 匹配 =====
function startMatchmaking(){
  matchPhase = 'waiting';
  waitingStart = Date.now();
  var big = document.getElementById('matchBig');
  var cd = document.getElementById('matchCountdown');
  var tip = document.getElementById('matchTip');
  big.textContent = '正在寻找真人玩家…';
  cd.textContent = '40';
  tip.textContent = teamSize + 'v' + teamSize + ' · 超时未匹配到将自动进入 AI 对局';

  // 上传自己到匹配池
  try {
    sb.rpc('battle_update_pos', {
      p_user: ensureNetId(), p_mode: 'team_match_' + teamSize,
      p_x: 0, p_y: 0, p_hp: 100, p_weapon: 'rifle',
      p_team: 'red', p_kills: 0
    });
  } catch(e){}

  if(matchTimer) clearInterval(matchTimer);
  matchTimer = setInterval(function(){
    var elapsed = Date.now() - waitingStart;
    var left = Math.max(0, Math.ceil((MATCH_WAIT - elapsed) / 1000));
    cd.textContent = left;

    // 查匹配池人数
    checkMatchPool();

    if(elapsed >= MATCH_WAIT){
      clearInterval(matchTimer); matchTimer = null;
      startBattle();
    }
  }, 500);
}

async function checkMatchPool(){
  try {
    var res = await sb.rpc('battle_get_online', { p_mode: 'team_match_' + teamSize });
    if(res.error || !res.data) return;
    var data = res.data;
    if(typeof data === 'string'){ try{ data = JSON.parse(data); }catch(e){ return; } }
    if(!Array.isArray(data)) return;
    var id = ensureNetId();
    var others = data.filter(function(p){ return p.username !== id; });
    if(others.length > 0){
      document.getElementById('matchBig').textContent = '已找到 ' + others.length + ' 名真人！即将开始…';
    }
  } catch(e){}
}

window.skipMatch = function(){
  if(matchTimer) clearInterval(matchTimer);
  matchTimer = null;
  startBattle();
};

// ===== 开始战斗 =====
function startBattle(){
  matchPhase = 'playing';
  matchStartAt = Date.now();
  document.getElementById('matchModal').classList.remove('show');
  spawnProtectUntil = performance.now() + 8000;

  // 红队：1 个自己 + 若干 AI
  // 黑队：全 AI
  ais = [];
  for(var i=1; i<teamSize; i++) ais.push(createAI('red'));
  for(var j=0; j<teamSize; j++) ais.push(createAI('blue'));

  // 上传自己的位置
  uploadMyPos();

  gameRunning = true;
  lastTime = 0;
  requestAnimationFrame(gameLoop);
}

// ===== 结束战斗 =====
function endBattle(){
  matchPhase = 'over';
  gameRunning = false;
  if(matchTimer) clearInterval(matchTimer);

  var overlay = document.getElementById('endModal');
  var title = document.getElementById('endTitle');
  var result = document.getElementById('endResult');
  var score = document.getElementById('endScore');

  var win;
  if(scoreRed > scoreBlue){ win = '红队胜利！'; title.style.color = '#f87171'; }
  else if(scoreBlue > scoreRed){ win = '蓝队胜利！'; title.style.color = '#60a5fa'; }
  else { win = '平局！'; title.style.color = '#fbbf24'; }

  result.textContent = win;
  score.textContent = '红 ' + scoreRed + ' : ' + scoreBlue + ' 蓝';
  overlay.classList.add('show');
}

// ===== 主循环 =====
function gameLoop(ts){
  if(!gameRunning) return;
  try {
    if(!lastTime) lastTime = ts;
    var dt = Math.min((ts - lastTime) / TICK, 2);
    lastTime = ts;

    if(matchPhase === 'playing'){
      updatePlayer(dt);
      for(var i=0;i<ais.length;i++) updateAI(ais[i], dt);
      updateBullets(dt);
      updateCamera();

      var elapsed = Date.now() - matchStartAt;
      var left = Math.max(0, MATCH_DURATION - elapsed);
      var m = Math.floor(left / 60000);
      var s = Math.floor((left % 60000) / 1000);
      document.getElementById('timer').textContent = m + ':' + (s<10?'0':'') + s;

      if(left <= 0){ endBattle(); return; }
    }

    render();
    renderMinimap();
  } catch(e){
    console.error('gameLoop 崩了：', e);
  }
  requestAnimationFrame(gameLoop);
}

// ===== 初始化 =====
async function initGame(){
  try { await autoLogin(); } catch(e){}
  var ok = await checkAntiAddiction();
  if(!ok){ setTimeout(function(){ location.href = LOBBY_URL; }, 100); return; }

  buildObstacles();
  placeMerchant();
  spawnGoldBlocks();

  WEAPONS.rifle._bought = true;
  WEAPONS.knife._bought = true; // 长刀免费

  myPlayer = createPlayer();
  crosshair.x = myPlayer.x;
  crosshair.y = myPlayer.y;

  if(currentUser && currentUser.username && currentUser.role !== 'guest'){
    try {
      var ur = await sb.from('battle_users')
        .select('coins,kills,deaths,owned_weapons,hp_pack,hp_super,energy')
        .eq('username', currentUser.username).limit(1);
      if(ur.data && ur.data[0]){
        var d = ur.data[0];
        myPlayer.gold = d.coins || 0;
        myPlayer.kills = d.kills || 0;
        myPlayer.deaths = d.deaths || 0;
        myPlayer.hp_pack = d.hp_pack || 0;
        myPlayer.hp_super = d.hp_super || 0;
        myPlayer.energy = d.energy || 0;
        if(d.owned_weapons){
          d.owned_weapons.split(',').forEach(function(k){
            if(WEAPONS[k]) WEAPONS[k]._bought = true;
          });
        }
      }
    } catch(e){}
  }

  if(isTouch){
    var ids = ['joy','fireBtn','reloadBtn','switchBtn','med1Btn','med2Btn','med3Btn'];
    for(var x=0;x<ids.length;x++){
      var el = document.getElementById(ids[x]);
      if(el) el.classList.add('show');
    }
  }

  resizeGame();
  updateAmmoHUD();
  updateMedCounts();
  updateScoreBoard();
  startChatPolling();

  document.getElementById('loadingOverlay').classList.add('hide');
  // 显示人数选择弹窗
  document.getElementById('modeModal').classList.add('show');
}

// ===== 退出 =====
window.exitGame = async function(){
  gameRunning = false;
  stopChatPolling();
  if(matchTimer) clearInterval(matchTimer);

  if(currentUser && currentUser.username && currentUser.role !== 'guest' && myPlayer){
    try {
      var ownedList = [];
      for(var wk in WEAPONS){
        if(WEAPONS[wk]._bought) ownedList.push(wk);
      }
      await sb.rpc('battle_sync_stats', {
        p_user: currentUser.username,
        p_token: getToken(),
        p_add_gold: Math.floor(myPlayer.gold),
        p_add_kills: myPlayer.kills,
        p_add_deaths: myPlayer.deaths,
        p_owned_weapons: ownedList.join(','),
        p_hp_pack: myPlayer.hp_pack,
        p_hp_super: myPlayer.hp_super,
        p_energy: myPlayer.energy
      });
      try { await sb.rpc('battle_leave', { p_user: ensureNetId() }); } catch(e){}
    } catch(e){ console.warn('保存失败', e); }
  }
  location.href = LOBBY_URL;
};

// ===== 聊天按钮 =====
document.getElementById('chatSend').addEventListener('click', sendChat);
document.getElementById('chatInput').addEventListener('keydown', function(e){
  if(e.key==='Enter') sendChat();
});

initGame();

})();
</script>
