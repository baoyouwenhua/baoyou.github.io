<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#05060a;color:#e0e0e0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;user-select:none;-webkit-user-select:none}

#gameLayer{position:fixed;inset:0;z-index:150;background:#05060a;display:block}

#topLeftHUD{position:fixed;left:12px;top:12px;width:260px;pointer-events:auto;z-index:60}
.hud-stat{background:rgba(0,0,0,.65);border:1px solid rgba(255,255,255,.12);border-radius:8px;padding:6px 12px;font-size:13px;margin-bottom:6px}
.hud-stat .gold{color:#fbbf24;font-weight:bold}
.hud-stat .kills{color:#f87171;font-weight:bold}

#worldChat{background:rgba(0,0,0,.55);border:1px solid rgba(74,222,128,.2);border-radius:10px;padding:8px;margin-top:6px}
#worldChatList{max-height:140px;overflow-y:auto;font-size:12px;line-height:1.5;margin-bottom:6px}

#worldChatList .cm{margin-bottom:3px;cursor:pointer;padding:2px 4px;border-radius:4px;word-break:break-word;transition:opacity .3s}
#worldChatList .cm:hover{background:rgba(239,68,68,.15)}

#worldChatInputRow{display:flex;gap:4px}

#worldChatSend{padding:6px 10px;border:none;border-radius:6px;background:#4ade80;color:#05060a;font-weight:900;font-size:12px;cursor:pointer;font-family:inherit}

#minimap{position:fixed;right:12px;top:52px;width:180px;height:180px;background:rgba(0,0,0,.55);border:1px solid rgba(74,222,128,.3);border-radius:10px;z-index:60}

#ammoCorner{position:fixed;right:16px;bottom:180px;background:rgba(0,0,0,.7);border:1px solid rgba(251,191,36,.5);border-radius:10px;padding:8px 16px;text-align:right;z-index:60}

#ammoCorner .lbl{font-size:11px;color:#888;margin-top:4px}
#ammoCorner #medTip{font-size:13px;color:#e0e0e0;margin-top:6px;letter-spacing:2px}

#killFeed{position:fixed;top:80px;left:50%;transform:translateX(-50%);z-index:55;pointer-events:none;text-align:center;min-width:200px}
.kill-msg{background:rgba(0,0,0,.55);color:#fff;font-size:14px;padding:6px 16px;border-radius:20px;margin-bottom:6px;display:inline-block;animation:killIn .3s ease;white-space:nowrap}
.kill-msg .k{color:#f87171;font-weight:bold}
.kill-msg .v{color:#888;font-weight:bold}
.kill-msg .arrow{color:#fbbf24;margin:0 8px}
@keyframes killIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}

#keyHint{position:fixed;left:12px;bottom:12px;background:rgba(0,0,0,.6);border:1px solid rgba(74,222,128,.2);border-radius:10px;padding:10px 14px;font-size:11px;color:#888;line-height:1.8;z-index:60;pointer-events:none}
#keyHint b{color:#4ade80;font-weight:900}

#joyKnob{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;background:rgba(255,255,255,.25)}

.g-btn{position:fixed;border-radius:50%;font-family:inherit;font-weight:bold;display:none;z-index:70;touch-action:none}
.g-btn.show{display:block}
#fireBtn{right:24px;bottom:32px;width:84px;height:84px;border:2px solid rgba(248,113,113,.6);background:rgba(248,113,113,.15);color:#f87171;font-size:14px}
#reloadBtn{right:116px;bottom:32px;width:64px;height:64px;border:2px solid rgba(251,191,36,.6);background:rgba(251,191,36,.15);color:#fbbf24;font-size:12px}
#switchBtn{right:24px;bottom:124px;width:64px;height:64px;border:2px solid rgba(96,165,250,.6);background:rgba(96,165,250,.15);color:#60a5fa;font-size:12px}

#med1Btn{left:24px;bottom:160px;width:56px;height:56px;border:2px solid rgba(74,222,128,.6);background:rgba(74,222,128,.15);color:#4ade80;font-size:22px}
#med2Btn{left:88px;bottom:160px;width:56px;height:56px;border:2px solid rgba(239,68,68,.6);background:rgba(239,68,68,.15);color:#f87171;font-size:22px}
#med3Btn{left:152px;bottom:160px;width:56px;height:56px;border:2px solid rgba(250,204,21,.6);background:rgba(250,204,21,.15);color:#facc15;font-size:22px}

#exitBtn{position:fixed;right:12px;top:12px;padding:8px 14px;background:rgba(0,0,0,.65);border:1px solid rgba(255,255,255,.15);border-radius:8px;color:#ccc;font-family:inherit;font-size:12px;cursor:pointer;z-index:80}

.modal-ov{position:fixed;inset:0;background:rgba(5,6,10,.88);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;z-index:400}
.modal-ov.show{display:flex}
.modal-card{width:360px;max-width:90vw;padding:28px;background:rgba(10,12,18,.98);border:1px solid rgba(74,222,128,.3);border-radius:16px;box-shadow:0 0 60px rgba(74,222,128,0.15)}

.modal-card textarea{width:100%;padding:11px 14px;margin-bottom:10px;border-radius:8px;border:1px solid rgba(255,255,255,.1);background:rgba(0,0,0,.5);color:#e0e0e0;font-family:inherit;font-size:14px;outline:none;min-height:80px;resize:vertical}
.modal-card .btn-row{display:flex;gap:10px;margin-top:14px}
.modal-card .btn-row button{flex:1;padding:11px;border-radius:8px;border:none;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer}
.btn-primary{background:#4ade80;color:#05060a}
.btn-ghost{background:transparent;border:1px solid rgba(255,255,255,.15);color:#888}

#loadingOverlay{position:fixed;inset:0;background:#05060a;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:500;gap:20px}
#loadingOverlay.hide{display:none}
.spinner{width:44px;height:44px;border:3px solid rgba(74,222,128,.2);border-top-color:#4ade80;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#loadingText{color:#4ade80;font-size:14px;letter-spacing:2px}
</style>
</head><body>

</div>

  return String(s==null?'':s).replace(/[&<>"']/g,function(c){

function getTodaySeed(){
  var now = new Date();
  var bj = new Date(now.getTime() + 8*3600*1000);
  return bj.getUTCFullYear()*10000 + (bj.getUTCMonth()+1)*100 + bj.getUTCDate();
}

  _seed = (_seed * 9301 + 49297) % 233280;

  var el = document.getElementById('worldChatList');

function loadWorldChat(){
  var listEl = document.getElementById('worldChatList');
  if(!listEl) return;
  sb.from('battle_world_chat_solo').select('*').eq('status','approved').order('created_at',{ascending:false}).limit(30).then(function(res){
    var data = (res.data || []).reverse();
    listEl.innerHTML = '';
    data.forEach(function(m){ addChatMsgEl(m); });
  }).catch(function(){});
  if(!worldChatChannel){
    try {
      worldChatChannel = sb.channel('world_chat_solo_live')

          if(m.status !== 'approved') return;
          addChatMsgEl(m);
        })
        .subscribe();
    } catch(e){}
  }
}

window.sendWorldChat = async function(){

  var content = input.value.trim();
  if(!content) return;

  try {
    var res = await sb.rpc('battle_send_world_solo', {p_from: uname, p_content: content});

      console.error('[sendWorldChat] error:', res.error);

    console.error('[sendWorldChat] exception:', e);

};

// ============================================

function showKill(killer, victim){

    tries++;
  } while(tries < 50 && hitObstacle(x, y, 14));

  aiSeq++;
  var pool = ['rifle','mg','sniper','knife','pistol'];
  var myWeapon = pool[Math.floor(Math.random()*pool.length)];
  return {
    x: x, y: y, r: 14,
    hp: 100, maxHp: 100,
    baseSpeed: 1.5 + Math.random()*0.4,
    speed: 1.6,
    name: '黑队' + aiSeq,
    dead: false, respawn: 0,
    fireCd: 0,
    wander: 0, wanderDir: 0,
    retreating: false,
    team: 'black',
    isMe: false,
    colors: {head:'#0a0a0a', body:'#1a1a1a', stroke:'#333'},
    weapon: myWeapon,
    gold: 0,
    ammo: { pistol: 30, rifle: 150, sniper: 5, mg: 250, knife: Infinity }
  };
}

// ============================================
// 障碍物 / 碰撞
// ============================================
function circleHitsRect(cx, cy, r, rect){
  var closestX = Math.max(rect.x, Math.min(cx, rect.x + rect.w));
  var closestY = Math.max(rect.y, Math.min(cy, rect.y + rect.h));
  var dx = cx - closestX, dy = cy - closestY;
  return dx*dx + dy*dy < r*r;
}
function hitObstacle(cx, cy, r){
  for(var i=0; i<obstacles.length; i++){
    if(circleHitsRect(cx, cy, r, obstacles[i])) return true;
  }
  return false;
}

function buildObstacles(){
  obstacles = [];
  _seed = getTodaySeed();
  var count = 40;
  var tries = 0;
  while(obstacles.length < count && tries < 500){
    tries++;
    var w = 100 + seededRandom()*180;
    var h = 100 + seededRandom()*180;
    var x = 100 + seededRandom()*(WORLD_W - 200 - w);
    var y = 100 + seededRandom()*(WORLD_H - 200 - h);
    if(x < WORLD_W/2 + 300 && x+w > WORLD_W/2 - 300 &&
       y < WORLD_H/2 + 300 && y+h > WORLD_H/2 - 300) continue;
    obstacles.push({x:x, y:y, w:w, h:h});
  }
}

// ============================================
// 灰块（赚钱点）
// ============================================
function spawnGoldBlocks(){
  goldBlocks = [];
  _seed = getTodaySeed() + 1;
  var count = 6;
  var tries = 0;
  while(goldBlocks.length < count && tries < 200){
    tries++;
    var size = 70;
    var x = 150 + seededRandom()*(WORLD_W - 300 - size);
    var y = 150 + seededRandom()*(WORLD_H - 300 - size);
    if(hitObstacle(x+size/2, y+size/2, size)) continue;
    if(merchant && Math.hypot(x+size/2 - merchant.x, y+size/2 - merchant.y) < 250) continue;
    var bad = false;
    for(var i=0; i<goldBlocks.length; i++){
      if(Math.hypot(x - goldBlocks[i].x, y - goldBlocks[i].y) < 300){bad=true;break;}
    }
    if(bad) continue;
    goldBlocks.push({x:x, y:y, w:size, h:size});
  }
}

// ============================================
// 商人
// ============================================
function placeMerchant(){
  _seed = getTodaySeed() + 2;
  merchant = {x: WORLD_W/2 + 280, y: WORLD_H/2, r:22, name:'商人', interactRange:90};
  var tries = 0;
  while(tries < 200 && hitObstacle(merchant.x, merchant.y, merchant.r + 10)){
    merchant.x = WORLD_W/2 + (seededRandom()-0.5)*900;
    merchant.y = WORLD_H/2 + (seededRandom()-0.5)*900;
    tries++;
  }
}

function distanceToMerchant(){
  if(!merchant || !myPlayer) return 999999;
  return Math.hypot(myPlayer.x - merchant.x, myPlayer.y - merchant.y);
}

function handleJoyMove(cx, cy){

function updateCamera(){

  var limit = CAM_LIMIT[myPlayer.weapon] || 0;

  var dx = crosshair.x - myPlayer.x;
  var dy = crosshair.y - myPlayer.y;
  var d = Math.hypot(dx, dy);

  }

  var cx = myPlayer.x + dx/2;
  var cy = myPlayer.y + dy/2;

  camera.x = cx - VIEW_W/2;

}

// ============================================
function hasWeapon(k){
  if(k==='pistol') return true;
  if(k==='knife') return WEAPONS.knife._bought;
  if(k==='rifle') return WEAPONS.rifle._bought && myPlayer.ammo.rifle > 0;
  if(k==='sniper') return WEAPONS.sniper._bought && myPlayer.ammo.sniper > 0;
  if(k==='mg') return WEAPONS.mg._bought && myPlayer.ammo.mg > 0;
  return false;
}

function switchWeapon(){
  if(!myPlayer || myPlayer.dead) return;
  var owned = [];
  for(var i=0;i<WEAPON_ORDER.length;i++){
    var k = WEAPON_ORDER[i];
    if(hasWeapon(k)) owned.push(k);
  }
  if(owned.length <= 1) return;
  var cur = owned.indexOf(myPlayer.weapon);
  var next = owned[(cur+1) % owned.length];
  myPlayer.weapon = next;
  myPlayer.reloading = false;
  updateAmmoHUD();
  showFloat(myPlayer.x, myPlayer.y - 30, WEAPONS[next].name, '#60a5fa');
}

function startReload(){
  if(!myPlayer || myPlayer.dead || myPlayer.reloading) return;
  var w = WEAPONS[myPlayer.weapon];
  if(w.melee) return;
  if(myPlayer.ammo[myPlayer.weapon] >= w.mag) return;
  myPlayer.reloading = true;
  myPlayer.reloadStart = performance.now();
}

function finishReload(){
  var w = WEAPONS[myPlayer.weapon];
  myPlayer.ammo[myPlayer.weapon] = w.mag;
  myPlayer.reloading = false;
  updateAmmoHUD();
}

function useMed(type){
  if(!myPlayer || myPlayer.dead) return;
  if(type==='hp_pack' && myPlayer.hp_pack > 0){
    if(myPlayer.hp >= myPlayer.maxHp) return;
    myPlayer.hp = Math.min(myPlayer.maxHp, myPlayer.hp + 20);
    myPlayer.hp_pack--;
    showFloat(myPlayer.x, myPlayer.y - 30, '+20 HP', '#4ade80');
  } else if(type==='hp_super' && myPlayer.hp_super > 0){
    if(myPlayer.hp >= myPlayer.maxHp) return;
    myPlayer.hp = Math.min(myPlayer.maxHp, myPlayer.hp + 60);
    myPlayer.hp_super--;
    showFloat(myPlayer.x, myPlayer.y - 30, '+60 HP', '#4ade80');
  } else if(type==='energy' && myPlayer.energy > 0){
    myPlayer.energy--;
    myPlayer.energyTime = 8000;
    showFloat(myPlayer.x, myPlayer.y - 30, '⚡ 加速', '#facc15');
  }
  updateMedCounts();
}

  }

    items.push({key:'mg', label:'机枪', desc:'伤害12 · 弹匣250', price: PRICES.mg.solo, type:'weapon'});
  } else {
    items.push({key:'ammo_mg', label:'机枪子弹 ×100', desc:'100 发', price: 50, type:'ammo', target:'mg', amount:100});
  }
  if(!WEAPONS.knife._bought){
    items.push({key:'knife', label:'长刀', desc:'近战 · 伤害30', price: PRICES.knife.solo, type:'weapon'});
  }

  items.push({key:'hp_pack', label:'血包 💊', desc:'+20 HP · 可叠3', price: PRICES.hp_pack.price, type:'med', target:'hp_pack'});
  items.push({key:'hp_super', label:'超血 🧪', desc:'+60 HP', price: PRICES.hp_super.price, type:'med', target:'hp_super'});

function buyItem(it){
  if(myPlayer.gold < it.price) return;
  if(it.type === 'weapon'){
    WEAPONS[it.key]._bought = true;
    if(it.key==='rifle') myPlayer.ammo.rifle = 150;
    if(it.key==='sniper') myPlayer.ammo.sniper = 5;
    if(it.key==='mg') myPlayer.ammo.mg = 250;
    if(it.key==='knife') myPlayer.ammo.knife = Infinity;
    myPlayer.weapon = it.key;
  } else if(it.type === 'ammo'){
    myPlayer.ammo[it.target] = (myPlayer.ammo[it.target]||0) + it.amount;
  } else if(it.type === 'med'){
    if(it.target==='hp_pack') myPlayer.hp_pack = Math.min(3, myPlayer.hp_pack + 1);
    else if(it.target==='hp_super') myPlayer.hp_super++;
    else if(it.target==='energy') myPlayer.energy++;
  }
  myPlayer.gold -= it.price;
  updateAmmoHUD();
  updateMedCounts();
  openShop();
}

function shoot(){
  if(!myPlayer || myPlayer.dead) return;
  var w = WEAPONS[myPlayer.weapon];
  if(myPlayer.reloading) return;
  if(!w.melee && myPlayer.ammo[myPlayer.weapon] <= 0){
    startReload();
    return;
  }

  if(w.melee){
    var dx0 = crosshair.x - myPlayer.x;
    var dy0 = crosshair.y - myPlayer.y;
    var d0 = Math.hypot(dx0, dy0) || 1;
    var tx = myPlayer.x + dx0/d0*40;
    var ty = myPlayer.y + dy0/d0*40;
    for(var i=0;i<ais.length;i++){
      var a = ais[i];
      if(a.dead) continue;
      if(Math.hypot(a.x - tx, a.y - ty) < 40){
        hitAI(a, w.dmg, myPlayer);
      }
    }
    return;
  }

  var dx = crosshair.x - myPlayer.x;
  var dy = crosshair.y - myPlayer.y;
  var d = Math.hypot(dx, dy);
  if(d < 0.01) return;
  dx /= d; dy /= d;

  var ang = Math.atan2(dy, dx) + (Math.random()-0.5) * w.spread * 2;
  var bullet = {
    x: myPlayer.x + Math.cos(ang)*(myPlayer.r+4),
    y: myPlayer.y + Math.sin(ang)*(myPlayer.r+4),
    vx: Math.cos(ang)*w.speed,
    vy: Math.sin(ang)*w.speed,
    owner: myPlayer,
    ownerTeam: myPlayer.team,
    ownerIsMe: true,
    life: w.range,
    dmg: w.dmg,
    pierceLeft: w.pierce || 0
  };
  bullets.push(bullet);

  myPlayer.ammo[myPlayer.weapon]--;
  updateAmmoHUD();
}

// ============================================
// AI 射击（按武器伤害 · 检查弹药）
// ============================================
function aiShoot(ai){
  var aw = WEAPONS[ai.weapon] || WEAPONS.rifle;

  if(!aw.melee){
    if(!ai.ammo) ai.ammo = {};
    if((ai.ammo[ai.weapon] || 0) <= 0){
      ai.weapon = 'pistol';
      aw = WEAPONS.pistol;
      if((ai.ammo.pistol || 0) <= 0) return;
    }
  }

  var target = null;
  var minD = 999999;

  if(myPlayer && !myPlayer.dead){
    var d0 = Math.hypot(myPlayer.x - ai.x, myPlayer.y - ai.y);
    if(d0 < minD){ minD = d0; target = myPlayer; }
  }
  for(var i=0;i<ais.length;i++){
    var other = ais[i];
    if(other === ai) continue;
    if(other.dead) continue;
    var d2 = Math.hypot(other.x - ai.x, other.y - ai.y);
    if(d2 < minD){ minD = d2; target = other; }
  }
  if(!target) return;

  if(aw.melee){
    if(minD < 50) hitAI(target, aw.dmg, ai);
    return;
  }
  if(minD > 700) return;

  var dx = target.x - ai.x;
  var dy = target.y - ai.y;
  var dd = Math.hypot(dx, dy) || 1;
  var spread = (aw.spread || 0.05) * 1.2;
  var ang = Math.atan2(dy, dx) + (Math.random()-0.5)*spread*2;

  var dmg = Math.round((aw.dmg || 15) * 0.6);
  bullets.push({
    x: ai.x + Math.cos(ang)*(ai.r+4),
    y: ai.y + Math.sin(ang)*(ai.r+4),
    vx: Math.cos(ang)*14,
    vy: Math.sin(ang)*14,
    owner: ai,
    ownerTeam: ai.team,
    ownerIsMe: false,
    life: 60,
    dmg: dmg,
    pierceLeft: 0
  });

  if(ai.ammo) ai.ammo[ai.weapon] = (ai.ammo[ai.weapon] || 0) - 1;
}

// ============================================
// 命中 AI（删掉实时写库 · 统一退出时保存）
// ============================================
function hitAI(ai, dmg, shooter){
  ai.hp -= dmg;
  showFloat(ai.x, ai.y - 30, '-' + dmg, '#ef4444');
  if(ai.hp > 0) return;

  ai.hp = 0;
  ai.dead = true;
  ai.respawn = 3000;

  var killerName = shooter ? shooter.name : '?';

  if(shooter === myPlayer){
    myPlayer.kills++;
    myPlayer.gold += 100;
    updateAmmoHUD();
  } else if(shooter){
    shooter.gold = (shooter.gold || 0) + 100;
  }

  showKill(killerName, ai.name);
}

// ============================================
// 命中玩家
// ============================================
function hitPlayer(dmg, shooter){
  if(!myPlayer || myPlayer.dead) return;
  myPlayer.hp -= dmg;
  showFloat(myPlayer.x, myPlayer.y - 30, '-' + dmg, '#ef4444');
  if(myPlayer.hp > 0) return;
  myPlayer.hp = 0;
  myPlayer.dead = true;
  myPlayer.respawn = 3000;
  myPlayer.deaths++;
  if(shooter){
    if(shooter.team) shooter.gold = (shooter.gold || 0) + 100;
    if(shooter.name) showKill(shooter.name, myPlayer.name);
  }
}

// ============================================
// 更新玩家
// ============================================
function updatePlayer(dt){
  if(!myPlayer) return;

  if(myPlayer.dead){
    myPlayer.respawn -= dt * TICK;
    if(myPlayer.respawn <= 0){
      myPlayer.dead = false;
      myPlayer.hp = myPlayer.maxHp;
      var tries = 0;
      do {
        myPlayer.x = WORLD_W/2 + (Math.random()-0.5)*600;
        myPlayer.y = WORLD_H/2 + (Math.random()-0.5)*600;
        tries++;
      } while(tries < 50 && hitObstacle(myPlayer.x, myPlayer.y, myPlayer.r));
    }
    return;
  }

  if(myPlayer.energyTime > 0){
    myPlayer.energyTime -= dt * TICK;
    myPlayer.speed = myPlayer.baseSpeed * 1.5;
  } else {
    myPlayer.speed = myPlayer.baseSpeed;
  }

  var curW = WEAPONS[myPlayer.weapon];
  if(curW.slow) myPlayer.speed *= (1 - curW.slow);

  var dx = 0, dy = 0;
  if(keys['w']) dy -= 1;
  if(keys['s']) dy += 1;
  if(keys['a']) dx -= 1;
  if(keys['d']) dx += 1;
  if(joyActive){ dx += joyVec.x; dy += joyVec.y; }

  var len = Math.hypot(dx, dy);
  var moving = false;
  if(len > 0.01){
    moving = true;
    if(len > 1){ dx /= len; dy /= len; }
    var nx = myPlayer.x + dx * myPlayer.speed * dt;
    var ny = myPlayer.y + dy * myPlayer.speed * dt;
    if(nx - myPlayer.r > 0 && nx + myPlayer.r < WORLD_W && !hitObstacle(nx, myPlayer.y, myPlayer.r)){
      myPlayer.x = nx;
    }
    if(ny - myPlayer.r > 0 && ny + myPlayer.r < WORLD_H && !hitObstacle(myPlayer.x, ny, myPlayer.r)){
      myPlayer.y = ny;
    }
  }

  if(!moving){
    for(var i=0;i<goldBlocks.length;i++){
      var g = goldBlocks[i];
      if(myPlayer.x > g.x && myPlayer.x < g.x+g.w &&
         myPlayer.y > g.y && myPlayer.y < g.y+g.h){
        myPlayer.gold += 10 * dt / 60;
        break;
      }
    }
  }

  if(myPlayer.reloading){
    var w = WEAPONS[myPlayer.weapon];
    if(performance.now() - myPlayer.reloadStart >= w.reload){
      finishReload();
    }
  }

  myPlayer.fireCd -= dt * TICK;
  var firing = mouseDown || mobileFire || keys[' '];
  if(firing && myPlayer.fireCd <= 0 && !myPlayer.reloading){
    shoot();
    myPlayer.fireCd = curW.cd;
  }
}

// ============================================
// AI 智能行为
// ============================================
function updateAI(ai, dt){
  if(performance.now() < spawnProtectUntil) return;

  if(ai.dead){
    ai.respawn -= dt * TICK;
    if(ai.respawn <= 0){
      ai.dead = false;
      ai.hp = ai.maxHp;
      ai.retreating = false;
      var pool = ['rifle','mg','sniper','knife','pistol'];
      ai.weapon = pool[Math.floor(Math.random()*pool.length)];
      ai.ammo = { pistol: 30, rifle: 150, sniper: 5, mg: 250, knife: Infinity };
      var tries = 0;
      do {
        var ang = Math.random() * Math.PI * 2;
        var d = 800 + Math.random() * 700;
        ai.x = (myPlayer ? myPlayer.x : WORLD_W/2) + Math.cos(ang) * d;
        ai.y = (myPlayer ? myPlayer.y : WORLD_H/2) + Math.sin(ang) * d;
        if(ai.x < 100) ai.x = 100;
        if(ai.y < 100) ai.y = 100;
        if(ai.x > WORLD_W - 100) ai.x = WORLD_W  - 100) ai.x = WORLD_W - 100;
        if(ai.y > WORLD_H - 100) ai.y = WORLD_H - 100;
        tries++;
      } while(tries < 50 && hitObstacle(ai.x, ai.y, ai.r));
    }
    return;
  }

  if(ai.retreating && ai.hp < ai.maxHp){
    ai.hp += 0.01 * dt;
    if(ai.hp > ai.maxHp) ai.hp = ai.maxHp;
    if(ai.hp >= ai.maxHp * 0.9) ai.retreating = false;
  }

  var target = null, minD = 999999;
  if(myPlayer && !myPlayer.dead){
    var d0 = Math.hypot(myPlayer.x - ai.x, myPlayer.y - ai.y);
    if(d0 < minD){ minD = d0; target = myPlayer; }
  }
  for(var i=0;i<ais.length;i++){
    var other = ais[i];
    if(other === ai || other.dead) continue;
    var d2 = Math.hypot(other.x - ai.x, other.y - ai.y);
    if(d2 < minD){ minD = d2; target = other; }
  }

  var canSee = !!target && minD < 2000;
  var aw = WEAPONS[ai.weapon] || WEAPONS.rifle;

  var idealMin = 200, idealMax = 400;
  if(aw.melee){ idealMin = 0; idealMax = 30; }
  else if(ai.weapon === 'pistol'){ idealMin = 150; idealMax = 280; }
  else if(ai.weapon === 'rifle'){ idealMin = 200; idealMax = 400; }
  else if(ai.weapon === 'mg'){ idealMin = 250; idealMax = 450; }
  else if(ai.weapon === 'sniper'){ idealMin = 500; idealMax = 700; }

  if(ai.hp < ai.maxHp * 0.3 && !ai.retreating) ai.retreating = true;

  var moveX = 0, moveY = 0;
  var dx = target ? target.x - ai.x : 0;
  var dy = target ? target.y - ai.y : 0;
  var dist = target ? minD : 0;

  if(canSee && dist > 0.01){
    if(ai.retreating){
      moveX = -dx / dist; moveY = -dy / dist;
    } else if(dist < idealMin){
      moveX = -dx / dist; moveY = -dy / dist;
    } else if(dist > idealMax){
      moveX = dx / dist; moveY = dy / dist;
    } else {
      ai.wander -= dt * TICK;
      if(ai.wander <= 0){
        ai.wander = 600 + Math.random() * 800;
        ai.wanderDir = Math.random() < 0.5 ? 1 : -1;
      }
      moveX = -dy / dist * ai.wanderDir * 0.7;
      moveY = dx / dist * ai.wanderDir * 0.7;
    }
  } else {
    if(ai.gold >= 300 && merchant){
      var dm = Math.hypot(merchant.x - ai.x, merchant.y - ai.y);
      if(dm > 60){
        moveX = (merchant.x - ai.x) / dm;
        moveY = (merchant.y - ai.y) / dm;
      } else {
        ai.gold = 0;
        var buyPool = ['rifle','mg','sniper','knife'];
        ai.weapon = buyPool[Math.floor(Math.random()*buyPool.length)];
        ai.ammo = { pistol: 30, rifle: 150, sniper: 5, mg: 250, knife: Infinity };
      }
    }
    else if(ai.gold < 300 && goldBlocks.length){
      var nearest = null, nd = 999999;
      for(var g=0; g<goldBlocks.length; g++){
        var gb = goldBlocks[g];
        var gd = Math.hypot(gb.x+gb.w/2 - ai.x, gb.y+gb.h/2 - ai.y);
        if(gd < nd){ nd = gd; nearest = gb; }
      }
      if(nearest){
        var tx = nearest.x + nearest.w/2;
        var ty = nearest.y + nearest.h/2;
        var tdx = tx - ai.x, tdy = ty - ai.y;
        var tdd = Math.hypot(tdx, tdy) || 1;
        if(tdd > 30){
          moveX = tdx/tdd; moveY = tdy/tdd;
        } else {
          ai.gold += 10 * dt / 60;
        }
      }
    } else {
      ai.wander -= dt * TICK;
      if(ai.wander <= 0){
        ai.wander = 1000 + Math.random() * 2000;
        ai.wanderDir = Math.random() * Math.PI * 2;
      }
      moveX = Math.cos(ai.wanderDir);
      moveY = Math.sin(ai.wanderDir);
    }
  }

  var nx = ai.x + moveX * ai.speed * dt;
  var ny = ai.y + moveY * ai.speed * dt;
  if(nx - ai.r > 0 && nx + ai.r < WORLD_W && !hitObstacle(nx, ai.y, ai.r)) ai.x = nx;
  if(ny - ai.r > 0 && ny + ai.r < WORLD_H && !hitObstacle(ai.x, ny, ai.r)) ai.y = ny;

  ai.fireCd -= dt * TICK;
  if(canSee && !ai.retreating && ai.fireCd <= 0){
    if(aw.melee){
      if(dist < 50){ aiShoot(ai); ai.fireCd = aw.cd; }
    } else if(dist < 700){
      aiShoot(ai);
      ai.fireCd = aw.cd * 2.5 + Math.random() * 200;
    }
  }
}

// ============================================
// 子弹更新
// ============================================
function updateBullets(dt){
  var newBullets = [];
  for(var i=0;i<bullets.length;i++){
    var b = bullets[i];
    var nx = b.x + b.vx * dt;
    var ny = b.y + b.vy * dt;
    b.life -= dt;

    if(nx < 0 || nx > WORLD_W || ny < 0 || ny > WORLD_H) continue;

    var hitWall = false;
    for(var j=0;j<obstacles.length;j++){
      var o = obstacles[j];
      if(nx > o.x && nx < o.x + o.w && ny > o.y && ny < o.y + o.h){
        if(b.pierceLeft > 0){
          b.pierceLeft--;
          b.dmg = Math.round(b.dmg * 0.5);
        } else {
          hitWall = true;
        }
        break;
      }
    }
    if(hitWall) continue;

    b.x = nx; b.y = ny;

    var consumed = false;

    if(myPlayer && !myPlayer.dead && b.owner !== myPlayer){
      if(Math.hypot(myPlayer.x - b.x, myPlayer.y - b.y) < myPlayer.r){
        hitPlayer(b.dmg, b.owner);
        consumed = true;
      }
    }

    if(!consumed){
      for(var k=0;k<ais.length;k++){
        var a = ais[k];
        if(a.dead) continue;
        if(b.owner === a) continue;
        if(Math.hypot(a.x - b.x, a.y - b.y) < a.r){
          hitAI(a, b.dmg, b.owner);
          consumed = true;
          break;
        }
      }
    }

    if(consumed) continue;
    if(b.life > 0) newBullets.push(b);
  }
  bullets = newBullets;
       }// ============================================
// 渲染

function render(){
  gctx.fillStyle = '#14141c';
  gctx.fillRect(0, 0, VIEW_W, VIEW_H);

  var GRID = 80;
  var startX = Math.floor(camera.x / GRID) * GRID;
  var startY = Math.floor(camera.y / GRID) * GRID;
  gctx.strokeStyle = 'rgba(255,255,255,0.03)';
  gctx.lineWidth = 1;
  for(var x=startX; x<camera.x + VIEW_W; x += GRID){
    gctx.beginPath();
    gctx.moveTo(x - camera.x, 0);
    gctx.lineTo(x - camera.x, VIEW_H);
    gctx.stroke();
  }
  for(var y=startY; y<camera.y + VIEW_H; y += GRID){
    gctx.beginPath();
    gctx.moveTo(0, y - camera.y);
    gctx.lineTo(VIEW_W, y - camera.y);
    gctx.stroke();
  }

  gctx.strokeStyle = 'rgba(255,255,255,0.15)';
  gctx.lineWidth = 3;
  gctx.strokeRect(-camera.x, -camera.y, WORLD_W, WORLD_H);

  for(var i=0;i<goldBlocks.length;i++){
    var g = goldBlocks[i];
    var sx = g.x - camera.x, sy = g.y - camera.y;
    if(sx + g.w < 0 || sx > VIEW_W || sy + g.h < 0 || sy > VIEW_H) continue;
    gctx.fillStyle = 'rgba(251,191,36,0.15)';
    gctx.fillRect(sx, sy, g.w, g.h);
    gctx.strokeStyle = 'rgba(251,191,36,0.6)';
    gctx.lineWidth = 2;
    gctx.setLineDash([6, 4]);
    gctx.strokeRect(sx, sy, g.w, g.h);
    gctx.setLineDash([]);
    gctx.fillStyle = '#fbbf24';
    gctx.font = 'bold 20px system-ui';
    gctx.textAlign = 'center';
    gctx.fillText('💰', sx + g.w/2, sy + g.h/2 + 7);
    gctx.textAlign = 'left';
  }

  for(var j=0;j<obstacles.length;j++){
    var o = obstacles[j];
    var ox = o.x - camera.x, oy = o.y - camera.y;
    if(ox + o.w < 0 || ox > VIEW_W || oy + o.h < 0 || oy > VIEW_H) continue;
    gctx.fillStyle = '#0d0d14';
    gctx.fillRect(ox, oy, o.w, o.h);
    gctx.strokeStyle = 'rgba(255,255,255,0.08)';
    gctx.lineWidth = 1;
    gctx.strokeRect(ox, oy, o.w, o.h);
  }

  if(merchant){
    var mx = merchant.x - camera.x, my = merchant.y - camera.y;
    if(mx + 60 > 0 && mx - 60 < VIEW_W && my + 60 > 0 && my - 60 < VIEW_H){
      var near = distanceToMerchant() < merchant.interactRange;
      if(near){
        gctx.beginPath();
        gctx.arc(mx, my, merchant.r + 15, 0, Math.PI*2);
        gctx.fillStyle = 'rgba(74,222,128,0.15)';
        gctx.fill();
      }
      gctx.fillStyle = '#d97706';
      gctx.fillRect(mx - merchant.r, my - merchant.r*0.3, merchant.r*2, merchant.r*1.6);
      gctx.strokeStyle = '#fbbf24';
      gctx.lineWidth = 2;
      gctx.strokeRect(mx - merchant.r, my - merchant.r*0.3, merchant.r*2, merchant.r*1.6);
      gctx.fillStyle = '#fbbf24';
      gctx.beginPath();
      gctx.arc(mx, my - merchant.r*0.4, merchant.r*0.85, 0, Math.PI*2);
      gctx.fill();
      gctx.strokeStyle = '#fef3c7';
      gctx.stroke();
      gctx.fillStyle = '#fff';
      gctx.font = 'bold 16px system-ui';
      gctx.textAlign = 'center';
      gctx.fillText('💰', mx, my - merchant.r*0.35);
      gctx.fillStyle = '#fbbf24';
      gctx.font = 'bold 12px system-ui';
      gctx.fillText('商人', mx, my - merchant.r*1.5 - 8);
      if(near){
        gctx.fillStyle = '#4ade80';
        gctx.font = 'bold 11px system-ui';
        gctx.fillText(isTouch ? '点我开商店' : '按 F 开商店', mx, my + merchant.r + 20);
      }
      gctx.textAlign = 'left';
    }
  }

  for(var k=0;k<ais.length;k++){
    drawPerson(ais[k]);
  }

  if(myPlayer) drawPerson(myPlayer);

  gctx.strokeStyle = '#fbbf24';
  gctx.lineWidth = 2;
  gctx.shadowColor = '#fbbf24';
  gctx.shadowBlur = 6;
  for(var m=0;m<bullets.length;m++){
    var b = bullets[m];
    var bsx = b.x - camera.x, bsy = b.y - camera.y;
    var bex = bsx - b.vx * 0.8, bey = bsy - b.vy * 0.8;
    gctx.beginPath();
    gctx.moveTo(bsx, bsy);
    gctx.lineTo(bex, bey);
    gctx.stroke();
  }
  gctx.shadowBlur = 0;

  var chx = crosshair.x - camera.x, chy = crosshair.y - camera.y;
  gctx.strokeStyle = '#fbbf24';
  gctx.lineWidth = 2;
  gctx.beginPath();
  gctx.arc(chx, chy, 10, 0, Math.PI*2);
  gctx.stroke();
  gctx.beginPath();
  gctx.moveTo(chx-16, chy); gctx.lineTo(chx-4, chy);
  gctx.moveTo(chx+4, chy); gctx.lineTo(chx+16, chy);
  gctx.moveTo(chx, chy-16); gctx.lineTo(chx, chy-4);
  gctx.moveTo(chx, chy+4); gctx.lineTo(chx, chy+16);
  gctx.stroke();

  var newFloats = [];
  for(var f=0;f<floatTexts.length;f++){
    var ft = floatTexts[f];
    ft.life -= 16;
    ft.y += ft.vy;
    if(ft.life > 0){
      gctx.globalAlpha = Math.min(1, ft.life / 400);
      gctx.fillStyle = ft.color;
      gctx.font = 'bold 14px system-ui';
      gctx.textAlign = 'center';
      gctx.fillText(ft.text, ft.x - camera.x, ft.y - camera.y);
      gctx.textAlign = 'left';
      gctx.globalAlpha = 1;
      newFloats.push(ft);
    }
  }
  floatTexts = newFloats;
}

function drawPerson(t){
  if(t.dead) return;

  var sx = t.x - camera.x;
  var sy = t.y - camera.y;
  if(sx + 40 < 0 || sx - 40 > VIEW_W || sy + 40 < 0 || sy - 40 > VIEW_H) return;

  var isMe = t === myPlayer;
  var headColor, bodyColor, strokeColor;

  if(isMe){
    headColor = '#ef4444';
    bodyColor = '#dc2626';
    strokeColor = '#fca5a5';
  } else if(t.colors){
    headColor = t.colors.head;
    bodyColor = t.colors.body;
    strokeColor = t.colors.stroke;
  } else {
    headColor = '#ef4444';
    bodyColor = '#dc2626';
    strokeColor = '#fca5a5';
  }

  gctx.fillStyle = bodyColor;
  gctx.fillRect(sx - t.r, sy - t.r*0.3, t.r*2, t.r*1.6);
  gctx.strokeStyle = strokeColor;
  gctx.lineWidth = 1;
  gctx.strokeRect(sx - t.r, sy - t.r*0.3, t.r*2, t.r*1.6);

  gctx.fillStyle = headColor;
  gctx.beginPath();
  gctx.arc(sx, sy - t.r*0.4, t.r*0.85, 0, Math.PI*2);
  gctx.fill();
  gctx.strokeStyle = strokeColor;
  gctx.stroke();

  var wname = (WEAPONS[t.weapon] || WEAPONS.rifle).name;
  gctx.fillStyle = '#fbbf24';
  gctx.font = '10px system-ui';
  gctx.textAlign = 'center';
  gctx.fillText(wname, sx, sy + t.r*1.8 + 10);

  var aimX = isMe ? crosshair.x : (t.aimX || t.x);
  var aimY = isMe ? crosshair.y : (t.aimY || t.y);
  var ax = aimX - t.x, ay = aimY - t.y;
  var al = Math.hypot(ax, ay);
  if(al > 0.01){
    ax /= al; ay /= al;
    gctx.strokeStyle = isMe ? '#fca5a5' : '#666';
    gctx.lineWidth = 3;
    gctx.beginPath();
    gctx.moveTo(sx, sy);
    gctx.lineTo(sx + ax*(t.r+10), sy + ay*(t.r+10));
    gctx.stroke();
  }

  var barW = 44, barH = 4;
  var bx = sx - barW/2, by = sy - t.r*1.5 - 14;
  gctx.fillStyle = 'rgba(0,0,0,0.6)';
  gctx.fillRect(bx, by, barW, barH);
  var hpRatio = t.hp / t.maxHp;
  gctx.fillStyle = hpRatio > 0.5 ? '#4ade80' : hpRatio > 0.25 ? '#facc15' : '#ef4444';
  gctx.fillRect(bx, by, barW * hpRatio, barH);

  gctx.fillStyle = isMe ? '#fca5a5' : '#aaa';
  gctx.font = '11px system-ui';
  gctx.textAlign = 'center';
  gctx.fillText(t.name, sx, by - 4);
  gctx.textAlign = 'left';
}

var minimapCanvas = document.getElementById('minimap');
var mmctx = minimapCanvas ? minimapCanvas.getContext('2d') : null;
var MM_SIZE = 180;

function renderMinimap(){
  if(!mmctx) return;
  var scale = MM_SIZE / WORLD_W;

  mmctx.clearRect(0, 0, MM_SIZE, MM_SIZE);
  mmctx.fillStyle = 'rgba(20,20,28,0.85)';
  mmctx.fillRect(0, 0, MM_SIZE, MM_SIZE);

  mmctx.fillStyle = 'rgba(255,255,255,0.12)';
  for(var i=0;i<obstacles.length;i++){
    var o = obstacles[i];
    mmctx.fillRect(o.x*scale, o.y*scale, o.w*scale, o.h*scale);
  }

  mmctx.fillStyle = '#fbbf24';
  for(var g=0;g<goldBlocks.length;g++){
    var gb = goldBlocks[g];
    mmctx.fillRect(gb.x*scale, gb.y*scale, gb.w*scale, gb.h*scale);
  }

  if(merchant){
    mmctx.fillStyle = '#4ade80';
    mmctx.beginPath();
    mmctx.arc(merchant.x*scale, merchant.y*scale, 5, 0, Math.PI*2);
    mmctx.fill();
    mmctx.strokeStyle = '#fff';
    mmctx.lineWidth = 1;
    mmctx.stroke();
  }

  for(var a=0;a<ais.length;a++){
    var ai = ais[a];
    if(ai.dead) continue;
    mmctx.fillStyle = '#000';
    mmctx.beginPath();
    mmctx.arc(ai.x*scale, ai.y*scale, 2.5, 0, Math.PI*2);
    mmctx.fill();
    mmctx.strokeStyle = '#666';
    mmctx.lineWidth = 1;
    mmctx.stroke();
  }

  if(myPlayer){
    mmctx.fillStyle = '#fff';
    mmctx.beginPath();
    mmctx.arc(myPlayer.x*scale, myPlayer.y*scale, 4, 0, Math.PI*2);
    mmctx.fill();
    mmctx.strokeStyle = '#fbbf24';
    mmctx.lineWidth = 2;
    mmctx.stroke();
  }
}

function gameLoop(ts){
  if(!gameRunning) return;
  try {
    if(!lastTime) lastTime = ts;
    var dt = Math.min((ts - lastTime) / TICK, 2);
    lastTime = ts;

    updatePlayer(dt);
    for(var i=0;i<ais.length;i++) updateAI(ais[i], dt);
    updateBullets(dt);
    updateCamera();

    render();
    renderMinimap();
  } catch(e){
    console.error('gameLoop 崩了：', e);
  }
  requestAnimationFrame(gameLoop);
}

// ============================================
async function initGame(){
  try { await autoLoginSafe(); } catch(e){}

  buildObstacles();
  placeMerchant();
  spawnGoldBlocks();

  WEAPONS.rifle._bought = true;
  myPlayer = createPlayer();
  crosshair.x = myPlayer.x;
  crosshair.y = myPlayer.y;

  if(currentUser && currentUser.username){
    try {
      var ur = await sb.from('battle_users')
        .select('coins,kills,deaths')
        .eq('username', currentUser.username)
        .limit(1);
      if(ur.data && ur.data[0]){
        myPlayer.gold   = ur.data[0].coins  || 0;
        myPlayer.kills  = ur.data[0].kills  || 0;
        myPlayer.deaths = ur.data[0].deaths || 0;
      }
    } catch(e){}
  }

  ais = [];
  for(var i=0;i<7;i++){
    ais.push(createAI());
  }

  spawnProtectUntil = performance.now() + 8000;

  if(isTouch){
    var ids = ['joy','fireBtn','reloadBtn','switchBtn','med1Btn','med2Btn','med3Btn'];
    for(var x=0;x<ids.length;x++){
      var el = document.getElementById(ids[x]);
      if(el) el.classList.add('show');
    }
  }

  resizeGame();
  updateAmmoHUD();
  updateMedCounts();
  try { loadWorldChat(); } catch(e){}

  setTimeout(function(){
    var ov = document.getElementById('loadingOverlay');
    if(ov) ov.classList.add('hide');
  }, 300);

  gameRunning = true;
  lastTime = 0;
  requestAnimationFrame(gameLoop);
}

// ============================================
// 退出 → 返回大堂（退出时保存战绩）
// ============================================
window.exitGame = async function(){
  gameRunning = false;
  if(worldChatChannel){
    try{ worldChatChannel.unsubscribe(); }catch(e){}
    worldChatChannel = null;
  }

  if(currentUser && currentUser.username && currentUser.role !== 'guest' && myPlayer){
    try {
      await sb.rpc('battle_sync_stats', {
        p_user: currentUser.username,
        p_add_gold: Math.floor(myPlayer.gold),
        p_add_kills: myPlayer.kills,
        p_add_deaths: myPlayer.deaths
      });
    } catch(e){ console.warn('保存失败', e); }
  }

  location.href = LOBBY_URL;
};

// ============================================
// 收尾
// ============================================
document.getElementById('worldChatSend').addEventListener('click', sendWorldChat);
document.getElementById('worldChatInput').addEventListener('keydown', function(e){
  if(e.key==='Enter') sendWorldChat();
});

initGame();

})();
</script>
</body>
</html>
